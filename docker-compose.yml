services:
  db:
    image: postgres:17
    container_name: seatbooking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: seatbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatbooking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: